name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build UnoFace
        run: cmake --build build --config Release

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Locate Executable
        id: locate_bin
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path "build" -Recurse -Filter "unoface.exe" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Found executable at: $exePath"
          echo "EXE_PATH=$exePath" >> $env:GITHUB_ENV

      - name: Determine Release Tag
        id: tag_info
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            $tag = "${{ github.ref_name }}"
          } else {
            $tag = "v0.2.${{ github.run_number }}"
          }
          Write-Host "Target release tag: $tag"
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnoFace-Windows-x64
          path: ${{ env.EXE_PATH }}
          if-no-files-found: error

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: UnoFace ${{ env.RELEASE_TAG }}
          files: ${{ env.EXE_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
