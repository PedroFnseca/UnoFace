name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build UnoFace
        run: cmake --build build --config Release

      - name: Run Unit Tests
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Locate Executable
        id: locate_bin
        shell: pwsh
        run: |
          $exePath = Get-ChildItem -Path "build" -Recurse -Filter "unoface.exe" | Select-Object -First 1 -ExpandProperty FullName
          Write-Host "Found executable at: $exePath"
          echo "EXE_PATH=$exePath" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnoFace-Windows-x64
          path: ${{ env.EXE_PATH }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.EXE_PATH }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
